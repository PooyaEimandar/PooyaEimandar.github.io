[package]
name = "pooya-portfolio"
version = "0.1.0"
edition = "2024"
description = "Pooya Eimandar's Personal Website"
license = "MIT"
publish = false

[lib]
name = "pooya_portfolio"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pooya-portfolio"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sib = { git = "https://github.com/PooyaEimandar/sib", rev = "0e023300e80c89bc6247f8ed7a9b498c7653a707", default-features = false, features = [
    "render",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "Node",
    "Window",
    "console",
] }

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in"] }
pollster = "=1.0.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
